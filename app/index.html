<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1230" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Audiolivros">
  <meta name="description" content="Biblioteca pessoal de audiolivros.">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/BarlowCondensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
  <title>Audiolivros</title>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <nav id="tabs" class="tabs" role="tablist" aria-label="Seções do livro" hidden></nav>
  <div id="mini" class="mini" hidden></div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <form method="dialog" class="sheet-body"></form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
